rubi_heightmap_step_wavefront_planner:
  ros__parameters:
    use_sim_time: false
    input_cloud_topic: /rubi/offline_heightmap
    goal_topic: /goal_pose
    path_topic: /rubi/heightmap_step_planner/path
    debug_nodes_topic: /rubi/heightmap_step_planner/debug/nodes
    debug_edges_topic: /rubi/heightmap_step_planner/debug/edges
    debug_rejected_topic: /rubi/heightmap_step_planner/debug/rejected
    debug_revalidation_failure_topic: /rubi/heightmap_step_planner/debug/revalidation_failure
    debug_query_snap_topic: /rubi/heightmap_step_planner/debug/query_snap
    base_frame: base_link
    map_resolution_m: 0.05
    lattice_tolerance_m: 0.01
    max_grid_cells: 5000000
    transform_timeout_s: 0.20
    snap_start_to_valid_map: true
    snap_goal_to_valid_map: true
    start_snap_radius_m: 0.30
    goal_snap_radius_m: 0.25

    hard_clearance_radius_m: 0.20     # 0.20 -> 0.40 -> 0.25
    edge_check_spacing_m: 0.025
    max_crossable_height_jump_m: 0.08
    height_noise_floor_m: 0.01
    height_cost_exponent: 2.0
    distance_weight: 1.0
    height_cost_weight: 5.0

    preferred_clearance_radius_m: 0.35  # must be preferred_clearance_radius_m > hard_clearance_radius_m 0.2 -> 0.35
    clearance_cost_weight: 10.0          # 0.0 -> 5.0
    clearance_cost_exponent: 2.0

    node_sampling_distance_m: 0.30
    samples_per_expansion: 20
    merge_radius_m: 0.20
    neighbor_connection_radius_m: 0.45
    goal_connection_distance_m: 0.45
    max_nodes: 4000
    max_expansions: 4000
    max_graph_build_time_ms: 5000
    post_goal_expansions: 50
    path_output_spacing_m: 0.05
    path_invalid_confirmations: 2
    path_recovery_confirmations: 2
    max_replan_attempts: 5
    replan_retry_period_s: 0.5
    replan_retry_requires_new_map: false
    node_marker_scale_m: 0.08
    edge_marker_width_m: 0.025
    path_marker_width_m: 0.08
    rejected_marker_scale_m: 0.07
    max_rejected_markers: 5000
