local_costmap:
  # global_frame: odom
  global_frame: camera_init
  # robot_base_frame: BODY
  # robot_base_frame: base_footprint
  robot_base_frame: body
  update_frequency: 5.0   # 5.0 -> 10.0 -> 5.0
  publish_frequency: 5.0  # 5.0 -> 10.0 -> 5.0
  width: 6.0               # 5.0 -> 6.0
  height: 6.0
  resolution: 0.05
  static_map: false
  rolling_window: true
  transform_tolerance: 1.0        # AS as same as AMCL transform (nav_amcl.launch), 여유마진 0.5 -> 1.0

  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}


  obstacles:
    observation_sources: laser
    laser:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      obstacle_range: 4.0
      raytrace_range: 4.5
      min_obstacle_height: 0.0
      max_obstacle_height: 1.8
      observation_persistence: 0.2
      expected_update_rate: 0.0

  inflation:
    inflation_radius: 0.40
    cost_scaling_factor: 4.0