planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "pongbot_global_planner/AstarPlanner"


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /Odometry

    controller_plugins: ["FollowPath"]

    # Humble에서는 progress는 단수, goal은 복수형이다.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.7

      # 현재 Odometry.linear.x가 0이므로 고정 lookahead 사용
      use_velocity_scaled_lookahead_dist: false
      lookahead_dist: 1.5

      # 아래 값은 velocity-scaled lookahead를 다시 켤 때만 사용됨
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.0
      lookahead_time: 1.8

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.5

      # 주의:
      # 현재 angular.z=0이고 controller_frequency=10 Hz이므로
      # 1.0을 쓰면 RPP 출력이 매번 약 0.1 rad/s로 제한된다.
      #
      # 아래 5.0은 RPP 내부 제한을 통과시키기 위한 값이며,
      # 실제 물리적 가속도는 velocity_smoother의 1.0으로 제한한다.
      max_angular_accel: 5.0

      use_collision_detection: true

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true