planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["AStar"]

    AStar:
      plugin: "pongbot_global_planner/AstarPlanner"
      allow_unknown: false
      use_octile_heuristic: true
      lethal_cost: 253
      tie_breaker: 1.001
      cost_weight_alpha: 6.0
      weight_h: 1.05
      step_size: 0.2
      yaw_disc: 0.0872666
      goal_tol: 0.07

    # global costmap 최소(필수!)
    global_costmap:
      global_costmap:
        ros__parameters:
          global_frame: map
          robot_base_frame: body
          # 너희는 odom 대신 camera_init을 odom 역할로 씀
          # costmap 자체는 TF만 맞으면 됨
          update_frequency: 5.0
          publish_frequency: 2.0
          resolution: 0.05
          track_unknown_space: true
          plugins: ["static_layer", "inflation_layer"]
          static_layer:
            plugin: "nav2_costmap_2d::StaticLayer"
            map_subscribe_transient_local: true
          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            inflation_radius: 0.55
            cost_scaling_factor: 10.0

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    # 여기부터는 추후 튜닝/플러그인 선택 필요
    # 일단은 기본 DWB 또는 RPP 등을 구성해야 함

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: body
    odom_topic: /odom   # ⚠️ 너희가 odom을 publish 안 하면 수정 필요