TebLocalPlannerROS:
  # odom_topic: odom
  # map_frame: odom
  odom_topic: /Odometry
  map_frame: map_2d

  teb_autosize: true
  dt_ref: 0.1             # 0.3 -> 0.2, trajectory의 원하는 시간 해상도, 기반 control rate여야함
  # dt_ref = 1 / controller_frequency
  dt_hysteresis: 0.02     # 0.1 -> 0.02  , 권장 0.1
  max_samples: 500
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  via_points_ordered: true


  # -------------- Kinematics ---------------
  max_vel_x: 0.5
  max_vel_theta: 1.5
  acc_lim_x: 0.3
  acc_lim_theta: 1.5

  # holonomic condition
  max_vel_y: 0.0
  acc_lim_y: 0.0

  max_vel_x_backwards: 0.02
  
  min_turning_radius: 0.0
  wheelbase: 0.0

  # ---- Footprint ----
  footprint_model:
    # type: "polygon"
    # vertices: [[-0.55, -0.325], [-0.55, 0.325], [0.55, 0.325], [0.55, -0.325]]
    type: "circular"
    radius: 0.62
  min_obstacle_dist: 0.35
  inflation_dist: 0.45
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  dynamic_obstacle_inflation_dist: 0.6

  # --- Weight tunning ---
  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 5.0
  weight_acc_lim_theta: 8.0
  weight_kinematics_nh: 20.0
  weight_kinematics_forward_drive: 1000.0
  weight_kinematics_turning_radius: 1.0
  weight_optimaltime: 0.8             # trajectory smoothness (1.0 -> 0.8)
  weight_shortest_path: 0.0
  weight_obstacle: 20.0               # Obstacle Avoidance first (50.0 -> 90.0)
  weight_inflation:  0.1
  weight_viapoint: 8.0               # follow global path more (25.0 -> 10.0) 이거 너무 global path에 집착하는 정도
  weight_adapt_factor: 2.0

  # --- GLobal plan handling ---
  enable_homotopy_class_planning: false  # 대안경로를 찾는 homotopy_class_planning / 일단 false로
  max_number_classes: 4
  selection_alternative_time_cost: false

  global_plan_prune_distance: 1.0
  global_plan_viapoint_sep: 0.6        # Follow path more 0.25 -> 0.6 너무 붙는 경향
  trajectory_execution_enabled: true
  feasibility_check_no_poses: 5

  # --- Debug / Visualization ---
  publish_feedback: true                # False -> True

  # More
  xy_goal_tolerance: 0.20               # if robot arrived at goal in 0.2[m], finished
  yaw_goal_tolerance: 0.2               # robot finished at goal yaw in 0.2rad , approximately 11.5deg
  free_goal_vel: false                  # vel would be zero around goal

  # Recovery, 정 튜닝 안되면 이거 켜보기
  oscillation_recovery: true
  oscillation_filter_duration: 1.0
  oscillation_v_eps: 0.1
  oscillation_omega_eps: 0.1

  # Optimization
  weight_prefer_rotdir: 10.0