planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "pongbot_global_planner/AstarPlanner"

controller_server:
  ros__parameters:
    # launch의 RewrittenYaml이 true/false로 덮어쓴다.
    use_sim_time: false

    controller_frequency: 10.0
    odom_topic: /Odometry

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    controller_plugins: ["FollowPath"]

    # ROS2 Humble 형식
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"

      debug_trajectory_details: true

      # RUBI를 non-holonomic으로 사용
      min_vel_x: 0.0
      max_vel_x: 0.7
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.8

      min_speed_xy: 0.0
      max_speed_xy: 0.7
      min_speed_theta: 0.0

      # RUBI 시뮬레이션 초기 보수값
      acc_lim_x: 0.50
      acc_lim_y: 0.0
      acc_lim_theta: 1.20

      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.50

      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 41

      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.30
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      BaseObstacle.scale: 0.02

      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.15

      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.15

      PathDist.scale: 24.0
      GoalDist.scale: 20.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: camera_init
      robot_base_frame: base_link

      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05

      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.30

      track_unknown_space: false

      robot_radius: 0.25
      footprint_padding: 0.02

      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        footprint_clearing_enabled: true
        combination_method: 1
        tf_filter_tolerance: 0.30

        observation_sources: "livox_cloud"

        livox_cloud:
          topic: /livox/lidar_PointCloud2
          data_type: "PointCloud2"

          marking: true
          clearing: true

          obstacle_min_range: 0.20
          obstacle_max_range: 4.0

          raytrace_min_range: 0.30
          raytrace_max_range: 5.0

          # 아래 값은 예시다.
          # camera_init 기준 실제 지면 높이에 맞춰 반드시 수정할 것.
          min_obstacle_height: 0.1
          max_obstacle_height: 3.50

          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      # 초기 RViz 디버깅용. 검증 후 false로 바꿔도 됨.
      always_send_full_costmap: true



global_costmap:
  global_costmap:
