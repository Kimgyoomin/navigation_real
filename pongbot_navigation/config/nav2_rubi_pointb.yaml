planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "pongbot_global_planner/AstarPlanner"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # odom_topic: "/Odometry"         # When Using fast-lio localization
    odom_topic: "/genz/odometry"      # When using genz-icp localization
    enable_stamped_cmd_vel: false

    controller_plugins: ["FollowPath"]

    # Humble에서 네 기존 형태 유지. 여기서 괜히 동시에 여러 변수 바꾸지 말자.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.7       # pointfoot max 1.0 / 0.75 / 1.57, wheeled max 1.25 / 0.0 / 1.57  x / y / yaw
      max_linear_accel: 0.5
      lookahead_dist: 1.5
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.0
      lookahead_time: 1.8
      use_rotate_to_heading: true
      rotate_to_haeding_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785
      max_angular_accle: 1.0
      use_velocity_scaled_lookahead_dist: true

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 100000.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      # robot_base_frame: body
      robot_base_frame: base_link
      # odom_frame: odom
      odom_frame: camera_init
      update_frequency: 2.0
      publish_frequency: 1.0
      always_send_full_costmap: true   # 디버그용
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      transform_tolerance: 0.5
      robot_radius: 0.25
      plugins: ["static_layer", "inflation_layer"]
      # plugins: ["static_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

