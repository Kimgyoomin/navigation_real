local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init
      # robot_base_frame: body
      robot_base_frame: base_link 
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.5
      robot_radius: 0.25
      update_frequency: 10.0
      publish_frequency: 5.0
      always_send_full_costmap: true
      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    local_frame: camera_init
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5



smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin:       "nav2_smoother::SimpleSmoother"
      tolerance:    1.0                               # 경로 최적화 시 허용 오차 (너무 낮으면 안 펴짐)
      max_its:      1000                              # 반복 횟수 (많을수록 부드러워짐)
      w_data:       0.2                               # 원본 경로를 유지하려는 가중치
      w_smooth:     0.6                               # 경로를 부드럽게 만들려는 가중치 (이 값을 높이면 더 펴짐)      